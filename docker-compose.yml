services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rcs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rcs"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/mbs || true
      "
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rcs?schema=public
      PORT: 3001
      JWT_SECRET: change-me
      CALL_WEBHOOK_SECRET: call-secret-local
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_DIAGNOSTIC_AI_ENABLED: ${OPENAI_DIAGNOSTIC_AI_ENABLED:-false}
      OPENAI_DIAGNOSTIC_MODEL: ${OPENAI_DIAGNOSTIC_MODEL:-gpt-5-mini}
      OPENAI_DIAGNOSTIC_TIMEOUT_MS: ${OPENAI_DIAGNOSTIC_TIMEOUT_MS:-20000}
      NAMEPLATE_UPLOAD_MAX_FILE_BYTES: ${NAMEPLATE_UPLOAD_MAX_FILE_BYTES:-12582912}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: mbs
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
    command: >
      sh -c "npm run migrate:deploy -w @rcs/db &&
      npm run start -w @rcs/api"
    ports:
      - "3001:3001"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rcs?schema=public
      WORKER_POLL_MS: 2000
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: mbs
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rcs?schema=public

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: /api
      VITE_PROXY_TARGET: http://api:3001
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
