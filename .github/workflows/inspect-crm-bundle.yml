name: Inspect CRM bundle

on:
  push:
    branches:
      - feature/hvac-diagnostic-pwa
    paths:
      - MBS_FULL_REPO_BUNDLE.zip
      - .github/workflows/inspect-crm-bundle.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/hvac-diagnostic-pwa
          fetch-depth: 0

      - name: Inspect archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bundle-inspection .bundle-extract
          mkdir -p .bundle-inspection .bundle-extract
          unzip -q MBS_FULL_REPO_BUNDLE.zip -d .bundle-extract

          {
            echo "# CRM bundle manifest"
            echo
            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "## Top-level entries"
            find .bundle-extract -mindepth 1 -maxdepth 2 -printf '%P\n' | sort
            echo
            echo "## Full file list"
            find .bundle-extract -type f -printf '%P\t%s bytes\n' | sort
          } > .bundle-inspection/manifest.md

          find .bundle-extract -type f \
            \( -name 'package.json' -o -name 'pnpm-workspace.yaml' -o -name 'turbo.json' \
               -o -name 'tsconfig.json' -o -name 'vite.config.*' -o -name 'next.config.*' \
               -o -name 'drizzle.config.*' -o -name 'schema.prisma' -o -name 'requirements.txt' \
               -o -name 'pyproject.toml' -o -name 'Dockerfile' -o -name 'docker-compose*.yml' \
               -o -name 'docker-compose*.yaml' -o -name '.replit' -o -name 'replit.nix' \
               -o -iname 'README.md' -o -iname 'AGENTS.md' \) -print0 \
            | while IFS= read -r -d '' file; do
                relative="${file#.bundle-extract/}"
                destination=".bundle-inspection/key-files/$relative"
                mkdir -p "$(dirname "$destination")"
                cp "$file" "$destination"
              done

          {
            echo "# Key source directories"
            find .bundle-extract -type d \
              \( -name node_modules -o -name .git -o -name dist -o -name build -o -name .next -o -name coverage \) -prune -o \
              -type d -maxdepth 5 -printf '%P\n' | sort
          } > .bundle-inspection/directories.md

      - name: Commit inspection output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .bundle-inspection
          if git diff --cached --quiet; then
            echo "No inspection changes to commit."
            exit 0
          fi
          git commit -m "chore: inspect CRM source bundle"
          git push origin HEAD:feature/hvac-diagnostic-pwa
