name: Expand CRM bundle

on:
  push:
    branches:
      - feature/hvac-diagnostic-pwa
    paths:
      - .github/workflows/expand-crm-bundle.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/hvac-diagnostic-pwa
          fetch-depth: 0

      - name: Expand archived CRM source into branch
        shell: bash
        run: |
          set -euo pipefail
          extract_dir="$(mktemp -d)"
          unzip -q MBS_FULL_REPO_BUNDLE.zip -d "$extract_dir"
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/workflows/inspect-crm-bundle.yml' \
            --exclude '.github/workflows/expand-crm-bundle.yml' \
            "$extract_dir/" ./
          rm -rf "$extract_dir"

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "CRM bundle is already expanded."
            exit 0
          fi
          git commit -m "chore: expand CRM source for diagnostic integration"
          git push origin HEAD:feature/hvac-diagnostic-pwa
