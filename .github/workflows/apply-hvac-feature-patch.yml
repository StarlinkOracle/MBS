name: Apply HVAC feature patch

on:
  push:
    branches:
      - feature/hvac-diagnostic-pwa
    paths:
      - ".github/hvac-feature.patch.part*"
      - ".github/workflows/apply-hvac-feature-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hvac-diagnostic-pwa
          fetch-depth: 0

      - name: Reassemble and apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/hvac-feature.patch.part00 \
            .github/hvac-feature.patch.part01 \
            .github/hvac-feature.patch.part02 \
            .github/hvac-feature.patch.part03 \
            .github/hvac-feature.patch.part04 \
            .github/hvac-feature.patch.part05 \
            .github/hvac-feature.patch.part06 \
            > /tmp/hvac-feature.patch.gz.b64
          echo "b81974657fed0e7a29cdccbe9395e3566eb0a8852a7151e298e2184fb16de32d  /tmp/hvac-feature.patch.gz.b64" | sha256sum -c -
          base64 --decode /tmp/hvac-feature.patch.gz.b64 > /tmp/hvac-feature.patch.gz
          gzip -t /tmp/hvac-feature.patch.gz
          gzip -dc /tmp/hvac-feature.patch.gz > /tmp/hvac-feature.patch
          git apply --binary /tmp/hvac-feature.patch
          rm -rf .bundle-inspection
          rm -f .github/hvac-feature.patch.gz.b64
          rm -f .github/hvac-feature.patch.part*
          rm -f .github/workflows/apply-hvac-feature-patch.yml

      - name: Commit feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add CRM-integrated HVAC diagnostic PWA"
          git push origin HEAD:feature/hvac-diagnostic-pwa
