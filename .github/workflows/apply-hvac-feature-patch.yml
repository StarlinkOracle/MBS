name: Apply HVAC feature patch

on:
  push:
    branches:
      - feature/hvac-diagnostic-pwa
    paths:
      - ".github/hvac-feature.patch.gz.b64"
      - ".github/workflows/apply-hvac-feature-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hvac-diagnostic-pwa
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/hvac-feature.patch.gz.b64 > /tmp/hvac-feature.patch.gz
          gzip -dc /tmp/hvac-feature.patch.gz > /tmp/hvac-feature.patch
          git apply --binary /tmp/hvac-feature.patch
          rm -rf .bundle-inspection
          rm -f .github/hvac-feature.patch.gz.b64
          rm -f .github/workflows/apply-hvac-feature-patch.yml

      - name: Commit feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add CRM-integrated HVAC diagnostic PWA"
          git push origin HEAD:feature/hvac-diagnostic-pwa
