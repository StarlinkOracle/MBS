name: Inspect HVAC new-file patch

on:
  push:
    branches:
      - feature/hvac-diagnostic-pwa
    paths:
      - '.github/hvac-new.patch.part*'
      - '.github/workflows/inspect-hvac-new-files.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/hvac-diagnostic-pwa
          fetch-depth: 0

      - name: Decode available patch bytes
        shell: bash
        run: |
          set -euo pipefail
          cat .github/hvac-new.patch.part* | base64 --decode > /tmp/hvac-new.patch.xz
          set +e
          xz --decompress --stdout /tmp/hvac-new.patch.xz > /tmp/hvac-new.partial.patch 2> /tmp/xz-error.txt
          xz_status=$?
          set -e
          {
            echo '# HVAC staged patch inspection'
            echo
            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "XZ status: ${xz_status}"
            echo
            echo '## Decoder output'
            echo '```text'
            cat /tmp/xz-error.txt
            echo '```'
            echo
            echo '## Recovered patch bytes'
            echo '```text'
            wc -c /tmp/hvac-new.partial.patch
            echo '```'
            echo
            echo '## Recovered file paths'
            echo '```text'
            grep '^diff --git ' /tmp/hvac-new.partial.patch | sed -E 's#^diff --git a/([^ ]+) b/.*#\1#' || true
            echo '```'
            echo
            echo '## Recovered patch header'
            echo '```diff'
            sed -n '1,240p' /tmp/hvac-new.partial.patch
            echo '```'
          } > .github/hvac-new.patch.inspection.md

      - name: Commit inspection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/hvac-new.patch.inspection.md
          if git diff --cached --quiet; then
            echo 'No inspection changes to commit.'
            exit 0
          fi
          git commit -m 'chore: inspect available HVAC patch bytes'
          git push origin HEAD:feature/hvac-diagnostic-pwa
