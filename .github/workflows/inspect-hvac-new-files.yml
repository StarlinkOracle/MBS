name: Inspect HVAC new-file patch

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/hvac-diagnostic-pwa

      - name: Verify staged patch parts remain available
        shell: bash
        run: |
          set -euo pipefail
          ls -l .github/hvac-new.patch.part*
