name: Export expanded source

on:
  push:
    branches:
      - feature/hvac-diagnostic-pwa
    paths:
      - .github/workflows/export-source.yml
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/hvac-diagnostic-pwa
      - name: Prepare source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          rsync -a \
            --exclude '.git/' \
            --exclude 'MBS_FULL_REPO_BUNDLE.zip' \
            --exclude '.bundle-inspection/' \
            --exclude 'export/' \
            ./ export/
      - uses: actions/upload-artifact@v4
        with:
          name: mbs-expanded-source
          path: export
          include-hidden-files: true
          retention-days: 3
