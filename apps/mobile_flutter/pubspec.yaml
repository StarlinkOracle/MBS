name: mbs_mobile_flutter
description: Offline-first internal mobile client for HAMB/MBS tech + dispatch workflows.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.21.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.2
  connectivity_plus: ^6.0.5
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.21.2
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
